# Serves the built SPA and proxies API calls to the backend service.
#
# `/api/` is forwarded to the `backend` service on the compose network, so the
# browser talks to one origin and CORS is not involved.  `/docs` and
# `/openapi.json` are proxied too, which keeps the generated API documentation
# reachable in the container deployment.

upstream lakewatch_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets are content-hashed by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://lakewatch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://lakewatch_backend/health;
    }

    location /docs {
        proxy_pass http://lakewatch_backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://lakewatch_backend;
        proxy_set_header Host $host;
    }

    # Client-side routing: unknown paths fall back to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
