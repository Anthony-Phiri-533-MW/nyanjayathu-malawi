[project]
name = "lakewatch-backend"
version = "0.1.0"
description = "Lake Malawi satellite/ML water-level and water-quality monitoring system - Admin and Research modules"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "xarray>=2024.7",
    "h5netcdf>=1.3",
    "h5py>=3.11",
    "rasterio>=1.4",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "affine>=2.4",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]
local-models = [
    "joblib>=1.4",
    "scikit-learn==1.6.1",
    "xgboost>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that call real public provider endpoints (deselected by default)",
]

# Project-owned lint scope. Without this section ruff falls back to whatever
# user-level config is on the machine, which makes `ruff check` nondeterministic
# between developers; keep the ruleset conservative and explicit here.
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, B bugbear, UP pyupgrade.
select = ["E", "W", "F", "I", "B", "UP"]
# E501 is out of scope: the existing codebase has long lines (provider URLs,
# doc strings) that only a formatter pass should reflow; enabling it here would
# reorder 100+ lines with zero behaviour change and hide real findings.
ignore = ["E501"]
unfixable = ["B"]

[tool.setuptools.packages.find]
include = ["app*"]
