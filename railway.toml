# Railway configuration for the LakeWatch backend.
#
# Create a service from this repository and keep the service root directory at
# the repository root: `backend/Dockerfile` copies `backend/` from there.
# Add a PostgreSQL plugin to the project; Railway injects DATABASE_URL and the
# backend rewrites it to the psycopg 3 dialect automatically.
#
# The container entrypoint runs `alembic upgrade head` and binds to $PORT.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"
# Only rebuild when the backend or its build inputs change.
watchPatterns = ["backend/**", "railway.toml"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
