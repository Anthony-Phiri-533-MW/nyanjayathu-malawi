# Render Blueprint for the LakeWatch backend.
#
# The frontend is deployed separately on Cloudflare Pages (see DEPLOYMENT.md
# "Split deployment").  Render builds `backend/Dockerfile` with the repository
# root as the build context, because that Dockerfile copies `backend/`.
#
# Deploy: Render Dashboard -> New -> Blueprint -> select this repository.
# After the first deploy, set CORS_ORIGINS to the Cloudflare Pages origin.

databases:
  - name: lakewatch-db
    databaseName: lakewatch
    user: lakewatch
    # NOTE: the free database plan expires after ~30 days. Upgrade for anything
    # beyond a demo, and back it up before the expiry date.
    plan: free
    region: frankfurt

services:
  - type: web
    name: lakewatch-api
    runtime: docker
    plan: free
    region: frankfurt
    # Keep the context at the repository root: backend/Dockerfile copies
    # `backend/` from the root and runs Alembic from there.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render injects postgresql://... ; app/core/config.py rewrites it to the
      # psycopg 3 dialect, so no manual editing is needed.
      - key: DATABASE_URL
        fromDatabase:
          name: lakewatch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # The container entrypoint runs `alembic upgrade head` itself.
      - key: AUTO_CREATE_TABLES
        value: "false"
      - key: STARTUP_BOOTSTRAP
        value: "false"
      - key: JOBS_ENABLED
        value: "true"
      # Keep this at 1 instance: background jobs run inside the API process.
      - key: JOBS_WORKER_COUNT
        value: "2"
      # Free instances have an ephemeral filesystem. Attach a Render disk (paid
      # plan) mounted at /var/data and keep STORAGE_ROOT below it to persist
      # raw retrievals, exports and reports across deploys.
      - key: STORAGE_ROOT
        value: /var/data/storage
      # REQUIRED: the exact Cloudflare Pages origin, no trailing slash.
      # Multiple origins can be comma-separated, e.g.
      # https://lakewatch.pages.dev,https://lakewatch.example.org
      - key: CORS_ORIGINS
        sync: false
      # Optional dashboard assistant; leave blank to keep it disabled.
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_API_KEY
        sync: false
